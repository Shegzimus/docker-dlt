services:
  fxrateDatabase:
    image: postgres:13
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=fxrate_db
    volumes:
      - ./fx_data:/var/lib/postgresql/data
    ports:
      - 5435:5432


  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=root
    ports:
      - 8082:80
    depends_on:
      - fxrateDatabase
